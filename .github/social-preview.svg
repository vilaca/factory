<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Background -->
  <rect width="1280" height="640" fill="#0d1117"/>

  <!-- Subtle grid backdrop suggesting a terminal / coding surface -->
  <g stroke="#1a2230" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="6" fill="#58a6ff"/>

  <!-- Title -->
  <text x="80" y="200" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="120" font-weight="800" fill="#ffffff">
    🏭 factory
  </text>

  <!-- Tagline -->
  <text x="80" y="280" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="500" fill="#c9d1d9">
    A coding agent for any model — local or cloud, frontier or 7B.
  </text>

  <!-- Feature chips -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="600">
    <g transform="translate(80, 360)">
      <rect width="200" height="48" rx="24" fill="#161b22" stroke="#30363d"/>
      <text x="100" y="32" text-anchor="middle" fill="#58a6ff">16 providers</text>
    </g>
    <g transform="translate(300, 360)">
      <rect width="180" height="48" rx="24" fill="#161b22" stroke="#30363d"/>
      <text x="90" y="32" text-anchor="middle" fill="#58a6ff">multi-tab</text>
    </g>
    <g transform="translate(500, 360)">
      <rect width="180" height="48" rx="24" fill="#161b22" stroke="#30363d"/>
      <text x="90" y="32" text-anchor="middle" fill="#58a6ff">plan mode</text>
    </g>
    <g transform="translate(700, 360)">
      <rect width="180" height="48" rx="24" fill="#161b22" stroke="#30363d"/>
      <text x="90" y="32" text-anchor="middle" fill="#58a6ff">rotation</text>
    </g>
    <g transform="translate(900, 360)">
      <rect width="140" height="48" rx="24" fill="#161b22" stroke="#30363d"/>
      <text x="70" y="32" text-anchor="middle" fill="#58a6ff">MCP</text>
    </g>
    <g transform="translate(1060, 360)">
      <rect width="140" height="48" rx="24" fill="#161b22" stroke="#30363d"/>
      <text x="70" y="32" text-anchor="middle" fill="#58a6ff">headless</text>
    </g>
  </g>

  <!-- Terminal-style prompt at the bottom -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="28">
    <text x="80" y="500" fill="#8b949e">$</text>
    <text x="120" y="500" fill="#c9d1d9">npm i -g factory-code</text>
    <text x="80" y="548" fill="#8b949e">$</text>
    <text x="120" y="548" fill="#c9d1d9">factory</text>
    <rect x="240" y="528" width="16" height="28" fill="#58a6ff">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Footer bar -->
  <rect x="0" y="634" width="1280" height="6" fill="#58a6ff"/>
</svg>
