name: Knip

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # See lint.yml for why we pin npm via npx.
      - run: npx -y npm@11.12.1 ci
      # Advisory: this workflow reports failure when knip finds issues, but
      # it isn't marked as a required check in branch protection so it
      # surfaces drift without blocking merges.
      - run: npm run knip
