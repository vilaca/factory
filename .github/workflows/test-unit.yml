name: Test (unit)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Each shard runs under c8 so the gating test run also produces V8
  # raw coverage. Shards upload partial coverage as artifacts; the
  # merge job below consolidates and checks thresholds advisorily.
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [providers, core, rest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # See lint.yml for why we pin npm via npx.
      - run: npx -y npm@11.12.1 ci
      - run: npm run coverage:${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage/tmp
          if-no-files-found: error
          retention-days: 1

  coverage:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npx -y npm@11.12.1 ci
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage/tmp
          merge-multiple: true
      # Coverage thresholds are advisory: surface drift without blocking merges.
      - id: report
        run: |
          set -o pipefail
          npm run coverage:report | tee coverage/report.txt
        continue-on-error: true
      # Surface the totals line in the run summary so reviewers don't
      # need to dig through stdout. Keeps the table compact.
      - if: always()
        run: |
          {
            echo '## Unit coverage';
            echo;
            echo '```';
            head -3 coverage/report.txt;
            grep -E '^All files' coverage/report.txt || true;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
      # Drop the bulky raw V8 data before archiving the report.
      - if: always()
        run: rm -rf coverage/tmp
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
          retention-days: 14
