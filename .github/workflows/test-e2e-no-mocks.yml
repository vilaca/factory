name: Test (e2e no-mocks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-e2e-no-mocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # See lint.yml for why we pin npm via npx.
      - run: npx -y npm@11.12.1 ci
      - run: npm run test:e2e:no-mocks
