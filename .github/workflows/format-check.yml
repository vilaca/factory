name: Format check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # See lint.yml for why we pin npm via npx.
      - run: npx -y npm@11.12.1 ci
      # Advisory only: surface formatting drift without blocking merges.
      - run: npm run format:check
        continue-on-error: true
