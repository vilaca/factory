name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # Node 22 ships npm 10; the lockfile is generated by npm 11+ which has a
      # stricter peerDeps resolution. Upgrade before `npm ci` to avoid a
      # "package.json and package-lock.json not in sync" false-positive on
      # transitive peer ranges (e.g. @types/react@18 pulled through dev deps).
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run test:e2e
