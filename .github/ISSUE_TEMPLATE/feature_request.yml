name: Feature request
description: Suggest a new feature or enhancement.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case and the friction you're hitting today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you'd want it to work. Sketches, command examples, or screenshots all welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, related tools, or other approaches you weighed.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else worth knowing — links to similar features in other tools, prior discussions, etc.
